x-app-defaults: &app-defaults
  restart: unless-stopped
  networks:
    - jobgraph_net
  env_file:
    - .env.production

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-jobgraph}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jobgraph_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jobgraph}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    volumes:
      - redis_data:/data
    networks:
      - jobgraph_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prisma-migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    networks:
      - jobgraph_net
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy

  core-api:
    <<: *app-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: core-api
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully

  scraper:
    <<: *app-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: scraper
    expose:
      - "4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully

  frontend:
    restart: unless-stopped
    networks:
      - jobgraph_net
    build:
      context: ../../frontend/jobgraph-frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
    expose:
      - "3000"
    depends_on:
      - core-api

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - jobgraph_net
    depends_on:
      - core-api
      - scraper
      - frontend

networks:
  jobgraph_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
